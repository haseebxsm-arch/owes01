name : Node.js CI
on: [push,pull_request]
jobs:
build:
runs-on: ubuntu-lastest
strategy:
matrix:
node-nersion:[14,16]
steps:
- uses : actions/checkout@v2
- name: use Node.js ${{matrix.node-version{{
uses : actions/setup-node@v2
with:
node-version: ${{matrix.node-version}}
- run :npm install
- run : npm test
env :
CI: true
